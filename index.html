<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WVFAPS Tracker</title>
  </head>
  <body>
    <div id="categories">
      <section id="HFZ">
        <h2>HFZ</h2>
        <ul id="hfzList">
          <li>Ryan West</li>
        </ul>
      </section>
      <section id="national">
        <h2>National</h2>
        <ul id="natList">
          <li>Ryan West</li>
        </ul>
      </section>
      <section id="presidental">
        <h2>Presidental</h2>
        <ul id="presList">
          <li>Ryan West</li>
        </ul>
      </section>
    </div>
    <div id="table">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Age</th>
            <th>Trunk</th>
            <th>SR - L</th>
            <th>SR- R</th>
            <th>Push ups</th>
            <th>Pacer</th>
            <th>Plank</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td><input type="text" class="student-name" /></td>
            <td>
              <select class="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </td>
            <td><input type="number" class="student-age" /></td>

            <td><input type="number" class="trunk" /></td>
            <td><input type="number" class="sitReachL" /></td>
            <td><input type="number" class="sitReachR" /></td>
            <td><input type="number" class="pushup" /></td>
            <td><input type="number" class="pacer" /></td>
            <td><input type="number" class="plank" /></td>
          </tr>
          <tr>
            <td><input type="text" class="student-name" /></td>
            <td>
              <select class="gender">
                <option value="Male">Male</option>

              </select>
            </td>
            <td><input type="number" class="student-age" /></td>
            <td><input type="number" class="trunk" /></td>
            <td><input type="number" class="sitReachL" /></td>
            <td><input type="number" class="sitReachR" /></td>
            <td><input type="number" class="pushup" /></td>
            <td><input type="number" class="pacer" /></td>
            <td><input type="number" class="plank" /></td>
          </tr>
          <tr>
            <td><input type="text" class="student-name" /></td>
            <td>
              <select class="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </td>
            <td><input type="number" class="student-age" /></td>

            <td><input type="number" class="trunk" /></td>
            <td><input type="number" class="sitReachL" /></td>
            <td><input type="number" class="sitReachR" /></td>
            <td><input type="number" class="pushup" /></td>
            <td><input type="number" class="pacer" /></td>
            <td><input type="number" class="plank" /></td>
          </tr>
        </tbody>
      </table>
    </div>
    <button id="submit-btn">SUBMIT</button>

    <script src="./script.js"></script>
  </body>
</html>
